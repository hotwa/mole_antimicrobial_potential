[workspace]
channels = ["conda-forge"]
name = "mole-antimicrobial-potential"
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
pip = "*"

[pypi-dependencies]
fastapi = "==0.115.12"
httpx = "==0.27.2"

[tasks]
py-compile-score = "python -m py_compile api_server.py src/models.py src/reinvent_scoring.py src/service.py test/test_score_api.py"
test-score = { cmd = "python -m unittest discover -s test -p 'test_score_api.py' -v", depends-on = ["py-compile-score"] }
