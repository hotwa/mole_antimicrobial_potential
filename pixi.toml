[workspace]
channels = ["conda-forge"]
name = "mole-antimicrobial-potential"
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
pip = "*"
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
pyyaml = "*"
openpyxl = "*"
tqdm = "*"
matplotlib = "*"
seaborn = "*"
rdkit = "*"
xgboost = "*"
uvicorn = "*"

[pypi-dependencies]
fastapi = "==0.115.12"
httpx = "==0.27.2"
fastmcp = ">=0.3.0"
pubchempy = "*"
torch-geometric = "==2.5.0"

[tasks]
py-compile-score = "python -m py_compile api_server.py mole_cli.py src/batch_screening.py src/classifier_backend.py src/mole_representation.py src/models.py src/reinvent_scoring.py src/reinvent4_workflow.py src/service.py src/predictor.py src/prediction_scheduler.py scripts/legacy/health_check.py scripts/legacy/mcp_server.py scripts/legacy/mole_antimicrobial_prediction.py scripts/legacy/mole_representation.py scripts/legacy/predict_api.py workflows/reinvent4/scripts/score_bridge.py workflows/reinvent4/scripts/render_config.py workflows/reinvent4/scripts/run_reinvent4.py workflows/reinvent4/scripts/run_long_rl.py workflows/reinvent4/scripts/validate_scaffold.py workflows/reinvent4/scripts/evaluate_results.py workflows/reinvent4/scripts/analyze_rgroup_sites.py test/test_classifier_backend.py test/test_cli.py test/test_score_api.py test/test_reinvent4_workflow.py test/test_batch_screening.py test/test_prediction_scheduler.py"
mole = "python mole_cli.py"
install-cuda-torch = "python scripts/install_cuda_torch.py"
test-score = { cmd = "python -m unittest discover -s test -p 'test_score_api.py' -v", depends-on = ["py-compile-score"] }
test-cli = { cmd = "python -m unittest discover -s test -p 'test_cli.py' -v", depends-on = ["py-compile-score"] }
test-classifier-backend = { cmd = "python -m unittest discover -s test -p 'test_classifier_backend.py' -v", depends-on = ["py-compile-score"] }
test-reinvent4-workflow = { cmd = "python -m unittest discover -s test -p 'test_reinvent4_workflow.py' -v", depends-on = ["py-compile-score"] }
test-batch-screening = { cmd = "python -m unittest discover -s test -p 'test_batch_screening.py' -v", depends-on = ["py-compile-score"] }
test-cuda-torch = { cmd = "python -m unittest discover -s test -p 'test_install_cuda_torch.py' -v", depends-on = ["py-compile-score"] }
test-prediction-scheduler = { cmd = "python -m unittest discover -s test -p 'test_prediction_scheduler.py' -v", depends-on = ["py-compile-score"] }
validate-real-scaffold = "python workflows/reinvent4/scripts/validate_scaffold.py workflows/reinvent4/inputs/scaffolds/mother_scaffold.template.smi"
