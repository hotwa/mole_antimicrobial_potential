services:
  mole_api_0:
    build:
      context: .
      dockerfile: docker/Dockerfile.enhanced
    image: hotwa/mole_antimicrobial_potential:enhanced
    container_name: mole_api_0
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - MODE=api
      - HOST=0.0.0.0
      - PORT_API=8000
      - WORKERS_API=1
      - GPU_IDS=0
      - MODEL_LOAD_MODE=resident
      - MAX_CONCURRENT_REQUESTS=2
    volumes:
      - ./start.sh:/workspace/mole_antimicrobial_potential/start.sh:ro
      - ./ckpt:/workspace/mole_antimicrobial_potential/pretrained_model/model_ginconcat_btwin_100k_d8000_l0.0001
      - ./data:/workspace/mole_antimicrobial_potential/data
      - ./raw_data:/workspace/mole_antimicrobial_potential/raw_data
    working_dir: /workspace/mole_antimicrobial_potential
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mole_api_1:
    build:
      context: .
      dockerfile: docker/Dockerfile.enhanced
    image: hotwa/mole_antimicrobial_potential:enhanced
    container_name: mole_api_1
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8001"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - MODE=api
      - HOST=0.0.0.0
      - PORT_API=8000
      - WORKERS_API=1
      - GPU_IDS=1
      - MODEL_LOAD_MODE=resident
      - MAX_CONCURRENT_REQUESTS=2
    volumes:
      - ./start.sh:/workspace/mole_antimicrobial_potential/start.sh:ro
      - ./ckpt:/workspace/mole_antimicrobial_potential/pretrained_model/model_ginconcat_btwin_100k_d8000_l0.0001
      - ./data:/workspace/mole_antimicrobial_potential/data
      - ./raw_data:/workspace/mole_antimicrobial_potential/raw_data
    working_dir: /workspace/mole_antimicrobial_potential
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mole_lb:
    image: nginx:latest
    container_name: mole_lb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mole_api_0:
        condition: service_healthy
      mole_api_1:
        condition: service_healthy

  mole_mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.enhanced
    image: hotwa/mole_antimicrobial_potential:enhanced
    container_name: mole_mcp
    runtime: nvidia
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - MODE=mcp_enhanced
      - HOST=0.0.0.0
      - PORT_MCP=8001
      - MCP_TRANSPORT=http
      - GPU_IDS=0
      - MODEL_LOAD_MODE=resident
      - MAX_CONCURRENT_REQUESTS=2
    volumes:
      - ./start.sh:/workspace/mole_antimicrobial_potential/start.sh:ro
      - ./ckpt:/workspace/mole_antimicrobial_potential/pretrained_model/model_ginconcat_btwin_100k_d8000_l0.0001
      - ./data:/workspace/mole_antimicrobial_potential/data
      - ./raw_data:/workspace/mole_antimicrobial_potential/raw_data
    working_dir: /workspace/mole_antimicrobial_potential
    ports:
      - "8001:8001"
    tty: true
    stdin_open: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":\"health\",\"method\":\"tools/list\"}' http://localhost:8001/mcp"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
