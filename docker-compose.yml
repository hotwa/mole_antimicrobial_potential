services:
  # FastAPI 服务 - 保留现有 API 和自定义 SSE 端点
  mole_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hotwa/mole_antimicrobial_potential:latest
    container_name: mole_api
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - MODE=api
      - HOST=0.0.0.0
      - PORT_API=8000
      - WORKERS_API=2
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./ckpt:/workspace/mole_antimicrobial_potential/pretrained_model/model_ginconcat_btwin_100k_d8000_l0.0001
      - ./data:/workspace/mole_antimicrobial_potential/data
      - ./raw_data:/workspace/mole_antimicrobial_potential/raw_data
    working_dir: /workspace/mole_antimicrobial_potential
    ports:
      - "8000:8000"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # FastMCP 服务 - 标准 MCP 协议
  mole_mcp:
    image: hotwa/mole_antimicrobial_potential:latest
    container_name: mole_mcp
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - MODE=mcp
      - HOST=0.0.0.0
      - PORT_MCP=8001
      - MCP_TRANSPORT=http
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./ckpt:/workspace/mole_antimicrobial_potential/pretrained_model/model_ginconcat_btwin_100k_d8000_l0.0001
      - ./data:/workspace/mole_antimicrobial_potential/data
      - ./raw_data:/workspace/mole_antimicrobial_potential/raw_data
    working_dir: /workspace/mole_antimicrobial_potential
    ports:
      - "8001:8001"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: application/json, text/event-stream", "http://localhost:8001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
